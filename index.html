<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gift Battle Arena</title>
<style>
html,body{margin:0;height:100%;background:#0b0620;overflow:hidden}
canvas{display:block}
#title{position:fixed;top:12px;width:100%;text-align:center;color:#fff;font:700 20px system-ui;letter-spacing:2px;pointer-events:none}
#fps{position:fixed;bottom:8px;left:8px;color:#8f8;font:12px monospace}
#err{position:fixed;top:50px;left:8px;right:8px;color:#fff;background:#c0392b;font:13px monospace;padding:8px;display:none;z-index:9}
#anims{position:fixed;bottom:28px;width:100%;display:flex;justify-content:center;gap:6px}
#anims button{padding:10px 12px;border:0;border-radius:10px;background:#7c4dff;color:#fff;font:600 13px system-ui}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="title">GIFT BATTLE ARENA</div>
<div id="err"></div>
<div id="fps"></div>
<div id="anims"></div>
<script>
window.onerror=(m,s,l)=>{const e=document.getElementById('err');e.style.display='block';e.textContent=m+' @'+(s||'').split('/').pop()+':'+l;};
window.addEventListener('unhandledrejection',e=>window.onerror(String(e.reason)));
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
